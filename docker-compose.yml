services:
  # خادم التطبيق
  app:
    build: .
    container_name: hospital_app
    ports:
      - "8000:8000"
    environment:
      # عند استخدام postgres غيّر الرابط:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/hospital.db}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DEBUG: ${DEBUG:-True}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-5}
      REMINDER_HOURS_BEFORE: ${REMINDER_HOURS_BEFORE:-24}
      # إشعارات فورية اختيارية (تلغرام + ويبهوك عام)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      # نسخ احتياطي تلقائي مجدول (SQLite فقط)
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      # حماية الدخول: قفل بعد محاولات فاشلة
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      AUTH_IP_FAIL_MAX: ${AUTH_IP_FAIL_MAX:-30}
      AUTH_IP_WINDOW_MINUTES: ${AUTH_IP_WINDOW_MINUTES:-15}
    volumes:
      # حفظ البيانات والملفات عبر إعادة التشغيل
      - hospital_data:/app/data
      - hospital_uploads:/app/uploads
      - hospital_backups:/app/backups
      - hospital_outbox:/app/outbox
    restart: unless-stopped

  # قاعدة بيانات PostgreSQL (اختيارية)
  db:
    image: postgres:16-alpine
    container_name: hospital_db
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital_pass
      POSTGRES_DB: hospital
    volumes:
      - hospital_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  hospital_data:
  hospital_uploads:
  hospital_backups:
  hospital_outbox:
  hospital_pg:
