# 🔁 CI: pytest + الفحص الموحد + بناء صورة Docker عند كل push/PR
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  stack-check:
    name: الفحص الموحد الحيّ
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: تشغيل الخادم
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
      - name: الفحص الموحد الحيّ
        run: BASE_URL=http://127.0.0.1:8000 WAIT=60 python tests/stack_check.py
      - name: فحص PWA/Offline
        run: BASE_URL=http://127.0.0.1:8000 python tests/pwa_offline_check.py
      - name: اختبار حمل خفيف (p95 ≤ 700ms)
        run: BASE_URL=http://127.0.0.1:8000 python tests/load_test.py

  docker:
    name: بناء صورة Docker
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t hms-hospital:ci .
