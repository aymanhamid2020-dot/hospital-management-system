# 🔁 CI: pytest + الفحص الموحد الحيّ + اختبارات E2E + بناء صورة Docker + أرشفة النتائج عند كل push/PR
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q --tb=short
      - name: أرشفة سجلات pytest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            test-results/
            **/junit-*.xml
          retention-days: 7

  stack-check:
    name: الفحص الموحد الحيّ
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: تشغيل الخادم
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
      - name: الفحص الموحد الحيّ
        run: BASE_URL=http://127.0.0.1:8000 WAIT=60 python tests/stack_check.py
      - name: فحص PWA/Offline
        run: BASE_URL=http://127.0.0.1:8000 python tests/pwa_offline_check.py
      - name: اختبار حمل خفيف (p95 ≤ 700ms)
        run: BASE_URL=http://127.0.0.1:8000 python tests/load_test.py
      - name: أرشفة نتائج الفحص الموحد
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-check-results
          path: |
            test-results/
            **/junit-*.xml
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: pytest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - name: بذر بيانات تجريبية (الاختبارات تحتاج طبيبًا موجودًا)
        run: python seed_demo.py
      - run: npm ci
      - name: تثبيت المتصفح + توابع النظام
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: تشغيل الخادم
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8001 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 1
          done
      - name: اختبارات E2E
        run: BASE_URL=http://127.0.0.1:8001 npx playwright test --project=${{ matrix.browser }} --reporter=list
      - name: أرشفة نتائج E2E واللقطات
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  docs-pdf:
    name: توليد PDF الدليل
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: تثبيت Chromium
        run: npx playwright install --with-deps chromium
      - name: توليد docs/user-guide.pdf من HTML
        run: node scripts/gen-user-guide-pdf.js
      - name: حالة التزامن مع HTML
        run: |
          if git diff --quiet -- docs/user-guide.pdf; then
            echo "✅ PDF مطابق للملف المُلتزَم"
          else
            echo "ℹ️ PDF المُولَّد يختلف (خطوط النظام في Linux) — الأرشيف المرفوع هو المرجع"
            git diff --stat -- docs/user-guide.pdf
          fi
      - name: أرشفة PDF المُولَّد
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-guide-pdf
          path: docs/user-guide.pdf
          retention-days: 7

  docker:
    name: بناء صورة Docker
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t hms-hospital:ci .
      - name: أرشفة الصورة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/*.tar
          retention-days: 3
